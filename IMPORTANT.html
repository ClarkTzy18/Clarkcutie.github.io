<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> A Special Message for You ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6e6, #ffb3b3);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Layer */
        .heart-particle {
            position: absolute;
            color: rgba(214, 48, 49, 0.4);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            bottom: -20px;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Main Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 90%;
            width: 400px;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #d63031;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Photo Slideshow Carousel */
        .slideshow-container {
            width: 100%;
            height: 220px;
            position: relative;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Buttons Layout */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
            margin-top: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #27ae60;
        }

        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
        }

        /* Subtle Audio Widget */
        .audio-player {
            margin-top: 15px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .audio-player:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Photo Slideshow Area -->
        <div class="slideshow-container">
            <img class="slide" src="photo1.jpg" alt="Us 1">
            <img class="slide" src="photo2.jpg" alt="Us 2">
            <img class="slide" src="photo3.jpg" alt="Us 3">
        </div>

        <!-- CUSTOMIZE THE INVITE TEXT BELOW -->
        <h1 id="question">Hey [MEM]! ✨ Will you go out on a special day with me to [Sargo Cafe]? 🌹</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="acceptDate()">Yes!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>

        <!-- Background Music Widget (Loads a generic romantic tune safely) -->
        <div class="audio-player">
            <audio id="bgMusic" controls loop style="height: 30px; scale: 0.8;">
                <source src="https://soundhelix.com" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <script>
        // 1. Photo Slideshow Script
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let slides = document.getElementsByClassName("slide");
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}    
            if(slides.length > 0) {
                slides[slideIndex-1].style.display = "block";  
            }
            setTimeout(showSlides, 3000); // Changes image every 3 seconds
        }

        // 2. Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.body.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400); // Spawns a heart every 400ms

        // 3. Evasive Button Script
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // 4. Success State Script
        function acceptDate() {
            // CUSTOMIZE YOUR SUCCESS MESSAGE BELOW
            document.getElementById('question').innerHTML = "Yay! It's a Coffe Day! 🥰 Can't wait for [Sa libreng araw]! - Cutie, [Clark] ❤️";
            document.querySelector('.buttons').style.display = 'none';
            
            // Try to auto-play audio if browser permissions allow it on click
            document.getElementById('bgMusic').play();
            
            // Make hearts spawn even faster for a celebration effect!
            setInterval(createHeart, 100);
        }
    </script>

</body>
</html>
